<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WC 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .tab-btn { transition: all 0.2s; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    .dark ::-webkit-scrollbar-thumb { background: #4b5563; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

    /* Dark mode overrides for JS-rendered content */
    .dark .bg-white { background-color: #1f2937 !important; }
    .dark .bg-gray-50 { background-color: #111827 !important; }
    .dark .bg-gray-100 { background-color: #374151 !important; }
    .dark .border-gray-100 { border-color: #374151 !important; }
    .dark .border-gray-50 { border-color: #1f2937 !important; }
    .dark .divide-gray-50 > :not([hidden]) ~ :not([hidden]) { border-color: #1f2937 !important; }
    .dark .divide-gray-100 > :not([hidden]) ~ :not([hidden]) { border-color: #374151 !important; }
    .dark .text-gray-900 { color: #f9fafb !important; }
    .dark .text-gray-700 { color: #d1d5db !important; }
    .dark .text-gray-600 { color: #9ca3af !important; }
    .dark .text-gray-500 { color: #9ca3af !important; }
    .dark .text-gray-400 { color: #6b7280 !important; }
    .dark .text-gray-300 { color: #4b5563 !important; }
    .dark .hover\:bg-gray-50:hover { background-color: #374151 !important; }
    .dark .hover\:bg-gray-200:hover { background-color: #4b5563 !important; }
    .dark .bg-yellow-50 { background-color: rgba(234, 179, 8, 0.15) !important; }
    .dark .bg-green-100 { background-color: rgba(34, 197, 94, 0.2) !important; }
    .dark .bg-yellow-100 { background-color: rgba(234, 179, 8, 0.2) !important; }
    .dark .bg-red-100 { background-color: rgba(239, 68, 68, 0.2) !important; }
    .dark .bg-green-50 { background-color: rgba(34, 197, 94, 0.1) !important; }

    /* Bracket connector lines */
    .bracket { display: flex; gap: 0; }
    .bracket-round { display: flex; flex-direction: column; justify-content: center; position: relative; min-width: 200px; }
    .bracket-match-wrapper { display: flex; align-items: center; position: relative; }
    .bracket-match { flex: 1; min-width: 0; }
    .bracket-connector-right { width: 24px; position: relative; flex-shrink: 0; }
    .bracket-connector-left { width: 24px; position: relative; flex-shrink: 0; }

    /* Right connector: horizontal line from match to vertical bar */
    .bracket-connector-right::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 0;
      border-top: 2px solid #d1d5db;
    }

    /* Vertical bar connecting two matches into one */
    .bracket-pair { display: flex; flex-direction: column; position: relative; }
    .bracket-pair::after {
      content: '';
      position: absolute;
      right: 0;
      top: 25%;
      bottom: 25%;
      width: 0;
      border-right: 2px solid #d1d5db;
    }

    /* Left connector: horizontal line from vertical bar to next match */
    .bracket-connector-left::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 0;
      border-top: 2px solid #d1d5db;
    }

    .dark .bracket-connector-right::after,
    .dark .bracket-pair::after,
    .dark .bracket-connector-left::after {
      border-color: #4b5563;
    }
  </style>
  <script>
    // Apply dark mode before page renders to prevent flash
    (function() {
      const stored = localStorage.getItem('wc26_theme');
      if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen transition-colors">

  <!-- Header -->
  <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-extrabold text-gray-900 dark:text-white tracking-tight">
            &#9917; WC 2026
          </h1>
          <p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">
            Jun 11 &ndash; Jul 19, 2026 &middot; Times in JST
          </p>
        </div>
        <div class="flex items-center gap-2">
          <span id="last-refresh" class="text-xs text-gray-400 hidden sm:inline"></span>
          <button onclick="forceRefresh()" class="text-xs px-3 py-1.5 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors" title="Force refresh data">
            &#8635; Refresh
          </button>
          <button id="auto-refresh-btn" onclick="toggleAutoRefresh()" class="text-xs px-3 py-1.5 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
            &#8635; Auto
          </button>
          <button onclick="toggleDarkMode()" class="text-xs px-3 py-1.5 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors" title="Toggle dark mode" id="dark-mode-btn">
            &#9790;
          </button>
        </div>
      </div>

      <!-- Tabs -->
      <nav class="flex gap-1 mt-4 -mb-4 overflow-x-auto">
        <button data-tab="leaderboard" onclick="setActiveTab('leaderboard')" class="tab-btn px-4 py-2.5 text-sm font-medium border-b-2 border-blue-500 text-blue-600 whitespace-nowrap">
          Leaderboard
        </button>
        <button data-tab="players" onclick="setActiveTab('players')" class="tab-btn px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 whitespace-nowrap">
          Players
        </button>
        <button data-tab="results" onclick="setActiveTab('results')" class="tab-btn px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 whitespace-nowrap">
          Results
        </button>
        <button data-tab="upcoming" onclick="setActiveTab('upcoming')" class="tab-btn px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 whitespace-nowrap">
          Upcoming
        </button>
        <button data-tab="groups" onclick="setActiveTab('groups')" class="tab-btn px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 whitespace-nowrap">
          Groups
        </button>
        <button data-tab="bracket" onclick="setActiveTab('bracket')" class="tab-btn px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 whitespace-nowrap">
          Bracket
        </button>
        <button data-tab="charts" onclick="setActiveTab('charts')" class="tab-btn px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 whitespace-nowrap">
          Charts
        </button>
        <button data-tab="teams" onclick="setActiveTab('teams')" class="tab-btn px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 whitespace-nowrap">
          All Teams
        </button>
      </nav>
    </div>
  </header>

  <!-- Error Banner -->
  <div id="error-banner" class="hidden bg-red-50 dark:bg-red-900/30 border-b border-red-200 dark:border-red-800 text-red-700 dark:text-red-400 text-sm px-4 py-3 text-center"></div>

  <!-- Loading -->
  <div id="loading" class="hidden">
    <div class="max-w-6xl mx-auto px-4 py-12 text-center">
      <div class="inline-block animate-spin text-3xl">&#9917;</div>
      <p class="text-gray-400 mt-2">Loading match data...</p>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-6">

    <!-- Leaderboard Section -->
    <section data-section="leaderboard" class="fade-in">
      <div class="mb-4">
        <h2 class="text-lg font-bold text-gray-900 dark:text-white">Leaderboard</h2>
      </div>
      <div id="leaderboard-content" class="space-y-3">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- Players Section -->
    <section data-section="players" class="hidden fade-in">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-gray-900 dark:text-white">Player Details</h2>
      </div>
      <div id="players-content" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- Results Section -->
    <section data-section="results" class="hidden fade-in">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4">
        <h2 class="text-lg font-bold text-gray-900 dark:text-white">Match Results</h2>
        <div class="flex gap-2">
          <select id="filter-stage" onchange="applyFilters()" class="text-xs px-3 py-1.5 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg text-gray-600 dark:text-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="all">All Stages</option>
            <option value="GROUP_STAGE">Group Stage</option>
            <option value="LAST_32">Round of 32</option>
            <option value="LAST_16">Round of 16</option>
            <option value="QUARTER_FINALS">Quarter-Finals</option>
            <option value="SEMI_FINALS">Semi-Finals</option>
            <option value="THIRD_PLACE">3rd Place</option>
            <option value="FINAL">Final</option>
          </select>
          <select id="filter-player" onchange="applyFilters()" class="text-xs px-3 py-1.5 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg text-gray-600 dark:text-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="all">All Players</option>
            <option value="alex">Alex</option>
            <option value="david">David R.</option>
            <option value="julian">Jules/Tak</option>
            <option value="matt">Matt</option>
            <option value="dsk">DSK</option>
            <option value="patrick">Patrick</option>
          </select>
        </div>
      </div>
      <div id="results-content">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- Upcoming Section -->
    <section data-section="upcoming" class="hidden fade-in">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4">
        <h2 class="text-lg font-bold text-gray-900 dark:text-white">Upcoming Matches</h2>
        <div class="flex gap-2">
          <select onchange="document.getElementById('filter-stage').value=this.value; applyFilters()" class="text-xs px-3 py-1.5 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg text-gray-600 dark:text-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="all">All Stages</option>
            <option value="GROUP_STAGE">Group Stage</option>
            <option value="LAST_32">Round of 32</option>
            <option value="LAST_16">Round of 16</option>
            <option value="QUARTER_FINALS">Quarter-Finals</option>
            <option value="SEMI_FINALS">Semi-Finals</option>
            <option value="THIRD_PLACE">3rd Place</option>
            <option value="FINAL">Final</option>
          </select>
          <select onchange="document.getElementById('filter-player').value=this.value; applyFilters()" class="text-xs px-3 py-1.5 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg text-gray-600 dark:text-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="all">All Players</option>
            <option value="alex">Alex</option>
            <option value="david">David R.</option>
            <option value="julian">Jules/Tak</option>
            <option value="matt">Matt</option>
            <option value="dsk">DSK</option>
            <option value="patrick">Patrick</option>
          </select>
        </div>
      </div>
      <div id="upcoming-content">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- Groups Section -->
    <section data-section="groups" class="hidden fade-in">
      <div class="mb-4">
        <h2 class="text-lg font-bold text-gray-900 dark:text-white">Group Stage</h2>
      </div>
      <div id="groups-content">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- Bracket Section -->
    <section data-section="bracket" class="hidden fade-in">
      <div class="mb-4">
        <h2 class="text-lg font-bold text-gray-900 dark:text-white">Tournament Bracket</h2>
      </div>
      <div id="bracket-content" class="overflow-x-auto">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- Charts Section -->
    <section data-section="charts" class="hidden fade-in">
      <div class="mb-6">
        <h2 class="text-lg font-bold text-gray-900 dark:text-white mb-4">Points Over Time</h2>
        <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm p-4">
          <canvas id="points-chart" height="300"></canvas>
        </div>
      </div>
      <div class="mb-6">
        <h2 class="text-lg font-bold text-gray-900 dark:text-white mb-4">Position Over Time</h2>
        <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm p-4">
          <canvas id="position-chart" height="300"></canvas>
        </div>
      </div>
    </section>

    <!-- Teams Section -->
    <section data-section="teams" class="hidden fade-in">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-gray-900 dark:text-white">All Teams</h2>
        <p class="text-xs text-gray-400 dark:text-gray-500">Click a team to see match history</p>
      </div>
      <div id="teams-content">
        <!-- Rendered by JS -->
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-100 dark:border-gray-700 mt-12">
    <div class="max-w-6xl mx-auto px-4 py-6 text-center text-xs text-gray-400 dark:text-gray-500">
      WC 2026 &middot; Match data from
      <a href="https://github.com/openfootball/world-cup.json" target="_blank" class="text-blue-500 hover:underline">openfootball</a>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
